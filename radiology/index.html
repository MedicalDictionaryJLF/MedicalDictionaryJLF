<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radiology Trainer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <nav class="sitebar" aria-label="Website navigation">
        <a class="brand-link" href="../index.html">
          <span class="brand-kicker">Clinical Study Workspace</span>
          <strong>Medical Dictionary</strong>
        </a>
        <div class="site-actions">
          <button type="button" id="settingsButton" class="settings-button" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
          </button>
          <button type="button" id="loginButton" class="primary">Sign in with Google</button>
          <div id="accountBox" class="account-box hidden">
            <span>Signed in as <strong id="accountName">Google user</strong></span>
            <button type="button" id="syncButton" class="secondary">Sync now</button>
            <button type="button" id="logoutButton" class="ghost">Log out</button>
          </div>
        </div>
      </nav>

      <header class="topbar">
        <div class="title-group">
          <h1>Radiology Trainer</h1>
          <div class="card-meta" id="cardMeta">Loading</div>
          <div class="sync-status" id="syncStatus" role="status" aria-live="polite">Progress saves locally until you sign in.</div>
        </div>
        <div class="metrics" aria-label="Progress summary">
          <div>
            <span>Known</span>
            <strong id="knownCount">0</strong>
          </div>
          <div>
            <span>Review</span>
            <strong id="reviewCount">0</strong>
          </div>
          <div>
            <span>Unseen</span>
            <strong id="unseenCount">0</strong>
          </div>
        </div>
      </header>

      <main class="workspace">
        <section class="study-panel" aria-label="Flashcard">
          <div class="progress-row">
            <span id="positionText">0 / 0</span>
            <div class="progress-track" aria-hidden="true">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <span id="percentText">0%</span>
          </div>

          <div class="flashcard" id="flashcard" tabindex="0" role="button" aria-label="Flip card">
            <div class="flashcard-inner">
              <section class="card-face card-front">
                <div class="image-frame" id="imageFrame">
                  <img id="cardImage" alt="" />
                  <div id="magnifierLens" class="magnifier-lens" aria-hidden="true"></div>
                </div>
              </section>
              <section class="card-face card-back">
                <div class="answer-scroll">
                  <h2 id="answerTitle"></h2>
                  <div id="answerBody" class="answer-body"></div>
                </div>
              </section>
            </div>
          </div>

          <div class="controls">
            <button type="button" id="prevButton" class="secondary">Prev</button>
            <button type="button" id="flipButton" class="primary">Flip</button>
            <button type="button" id="nextButton" class="secondary">Next</button>
            <button type="button" id="fullscreenButton" class="secondary">Fullscreen</button>
            <button type="button" id="magnifierButton" class="secondary" aria-pressed="false">Magnifier</button>
            <button type="button" id="reviewButton" class="warning">Needs review</button>
            <button type="button" id="knownButton" class="success">Know it</button>
          </div>
        </section>

        <aside class="queue-panel" aria-label="Ordered cards">
          <div class="queue-header">
            <h2>Queue</h2>
            <button type="button" id="resetButton" class="ghost">Reset</button>
          </div>
          <div id="cardList" class="card-list"></div>
        </aside>
      </main>
    </div>

    <div id="settingsOverlay" class="settings-overlay" aria-hidden="true"></div>
    <aside id="settingsPanel" class="settings-panel" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="settingsTitle" tabindex="-1">
      <div class="settings-head">
        <h2 id="settingsTitle">Settings</h2>
        <button type="button" id="settingsClose" class="settings-close" aria-label="Close settings">&times;</button>
      </div>
      <section class="settings-block">
        <h3>Navigation</h3>
        <a class="settings-link" href="../index.html">Open main menu</a>
      </section>
      <section class="settings-block">
        <h3>Storage &amp; Sync</h3>
        <p id="settingsConnectionStatus" class="muted">Progress saves locally until you sign in.</p>
        <div class="settings-actions">
          <button type="button" id="settingsLoginButton" class="primary">Connect Google Drive</button>
          <button type="button" id="settingsSyncButton" class="secondary">Sync now</button>
          <button type="button" id="settingsLogoutButton" class="ghost">Log out</button>
        </div>
      </section>
    </aside>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="data/cards.js"></script>
    <script src="app.js"></script>
  </body>
</html>
