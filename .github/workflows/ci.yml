name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete verification
        run: npm run ci

      - name: Upload validation summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-summaries
          path: .artifacts/*.json
          if-no-files-found: ignore
          retention-days: 7
